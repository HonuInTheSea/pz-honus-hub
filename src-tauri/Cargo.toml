[package]
name = "pz-honus-hub"
version = "0.7.0"
description = "Honu's Project Zomboid Hub"
authors = ["HonuInTheSea"]
edition = "2024"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pz_honus_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["protocol-asset", "unstable"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-http = "2.5.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
walkdir = "2"
rayon = "1"
encoding_rs = "0.8"
tauri-plugin-os = "2.3.2"
sysinfo = "0.39.6"
rusqlite = { version = "0.32", features = ["bundled"] }
png = "0.17"
regex = "1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
fast_image_resize = "5.1.2"
fontdue = "0.9.4"
csscolorparser = "0.8.3"
pollster = "0.4"
wgpu = { version = "26.0.1", default-features = false, features = ["dx12", "vulkan", "gles", "wgsl"] }
